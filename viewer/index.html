<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AltstadtAuto Old Town Viewer</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #f4efe6; --dim: #c9bfae; --panel: rgba(24, 20, 17, 0.72); --line: rgba(255, 240, 220, 0.16); --accent: #e7b874; }
  html, body { margin: 0; height: 100%; background: #1b1714; color: var(--ink); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #ui { position: fixed; top: 12px; left: 12px; max-width: min(360px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #ui h1 { margin: 0 0 2px; font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  #ui .sub { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; align-items: center; }
  button, select { font: inherit; color: var(--ink); background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; cursor: pointer; }
  button:hover, select:hover { background: rgba(255, 255, 255, 0.14); }
  button.primary { border-color: rgba(231, 184, 116, 0.6); color: var(--accent); }
  #status { color: var(--dim); font-size: 12px; margin-top: 8px; min-height: 1.4em; }
  #help { color: var(--dim); font-size: 11.5px; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
  #ui.min > :not(h1):not(#toggle) { display: none; }
  #toggle { position: absolute; top: 8px; right: 10px; padding: 2px 8px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #1b1714; color: var(--dim); font-size: 14px; transition: opacity 0.6s; }
  #loading.gone { opacity: 0; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="loading">Building the Old Town...</div>
<div id="ui">
  <h1>AltstadtAuto: Old Town</h1>
  <button id="toggle" title="Hide panel">-</button>
  <div class="sub">by Louis Nordbø. Procedural, built in your browser from seed <span id="seed"></span>.</div>
  <div class="row" id="views"></div>
  <div class="row">
    <select id="time" title="Time of day">
      <option value="level">Evening (the town's own)</option>
      <option value="golden">Golden hour</option>
      <option value="afternoon">Afternoon</option>
      <option value="day">Midday</option>
    </select>
    <select id="quality" title="Post-processing quality">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high" selected>High</option>
      <option value="ultra">Ultra</option>
    </select>
  </div>
  <div class="row">
    <button id="glb" class="primary">Export .glb</button>
    <select id="glbDetail" title="glb detail"><option value="medium">Medium detail</option><option value="high">High detail</option></select>
    <button id="json">Export plan .json</button>
  </div>
  <div id="status"></div>
  <div id="help">Drag to orbit, right-drag to pan, wheel to zoom. W A S D to fly, Q / E down / up, Shift faster. URL options: ?seed=123 &amp;view=market &amp;time=golden &amp;quality=ultra</div>
</div>
<canvas id="c" tabindex="0"></canvas>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { buildOldTown, makePost, makeRenderer, planToJSON, bakeForExport } from '../code/index.js';
import { surfacesPending } from '../code/world/surfaces.js';
import { SPECS } from '../code/engine/parking.js';

const Q = new URLSearchParams(location.search);
const seed = Number(Q.get('seed')) || 20261004;
const $ = (id) => document.getElementById(id);
$('seed').textContent = seed;

const renderer = makeRenderer($('c'));
renderer.setSize(innerWidth, innerHeight, false);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.3, 900);

const t0 = performance.now();
const map = buildOldTown(scene, renderer, { seed, fog: { near: 200, far: 900 }, time: Q.get('time') || null });
const P = map.plan, T = P.T;

// parked vehicles: simple stand-ins (painted body, dark glasshouse, roof, wheels) where the game parks real cars
{
  const n = map.parking.length, o = new THREE.Object3D(), c = new THREE.Color();
  const box = new THREE.BoxGeometry(1, 1, 1), wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 1, 12).rotateZ(Math.PI / 2);
  const paint = new THREE.MeshStandardMaterial({ roughness: 0.3, metalness: 0.4 });
  const body = new THREE.InstancedMesh(box, paint, n), roof = new THREE.InstancedMesh(box, paint, n);
  const glass = new THREE.InstancedMesh(box, new THREE.MeshStandardMaterial({ color: 0x14181c, roughness: 0.08, metalness: 0.3 }), n);
  const wheels = new THREE.InstancedMesh(wheelGeo, new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 }), n * 4);
  const put = (mesh, i, p, x, y, z, sx, sy, sz) => {
    o.position.set(p.x, p.y, p.z); o.rotation.set(0, p.yaw, 0); o.updateMatrix();
    const m = new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion(), new THREE.Vector3(sx, sy, sz));
    mesh.setMatrixAt(i, o.matrix.clone().multiply(m));
  };
  map.parking.forEach((p, i) => {
    const S = SPECS[p.kind] || SPECS.city, scooter = p.kind === 'scooter', van = p.kind === 'van';
    const r = scooter ? 0.25 : 0.32, bodyTop = scooter ? 0.75 : van ? 1.25 : 0.9;
    put(body, i, p, 0, (r * 0.6 + bodyTop) / 2, 0, scooter ? 0.35 : S.W, bodyTop - r * 0.6, S.L * (scooter ? 0.7 : 1));
    body.setColorAt(i, c.set(p.color)); roof.setColorAt(i, c);
    const gl = scooter ? 0 : van ? S.L * 0.82 : S.L * 0.52, gz = van ? -0.05 : -0.1, gh = scooter ? 0 : S.H - bodyTop - 0.05;
    put(glass, i, p, 0, bodyTop + gh / 2, gz, scooter ? 0.001 : S.W * 0.9, Math.max(gh, 0.001), Math.max(gl, 0.001));
    put(roof, i, p, 0, bodyTop + gh, gz, scooter ? 0.001 : S.W * 0.86, scooter ? 0.001 : 0.06, Math.max(gl * 0.95, 0.001));
    const ax = S.L * 0.33, hw = scooter ? 0 : S.W / 2 - 0.12;
    [[-hw, ax], [hw, ax], [-hw, -ax], [hw, -ax]].forEach(([x, z], k) => put(wheels, i * 4 + k, p, x, r, z, scooter ? 0.1 : 0.22, r * 2, r * 2));
  });
  for (const m of [body, roof, glass, wheels]) { m.castShadow = m.receiveShadow = true; m.name = 'viewer.parked'; scene.add(m); }
}

const post = makePost(renderer, scene, camera);
post.setQuality(Q.get('quality') || 'high');
$('quality').value = Q.get('quality') || 'high';

// ---------- views ----------
const lane = P.lanes.filter((l) => l.kind === 'lane' && !l.square).sort((a, b) => Math.hypot((a.x0 + a.x1) / 2 - 20, (a.z0 + a.z1) / 2 + 60) - Math.hypot((b.x0 + b.x1) / 2 - 20, (b.z0 + b.z1) / 2 + 60))[0];
const laneView = (() => {
  if (!lane) return [[0, T + 1.7, -100], [0, T + 4, -60]];
  const cx = (lane.x0 + lane.x1) / 2, cz = (lane.z0 + lane.z1) / 2;
  return lane.axis === 'x'
    ? [[lane.x0 + 6, T + 1.7, cz], [lane.x1, T + 3.5, cz]]
    : [[cx, T + 1.7, lane.z0 + 6], [cx, T + 3.5, lane.z1]];
})();
const cathedral = P.sites.find((s) => s.kind === 'cathedral');
const VIEWS = {
  aerial: { label: 'Aerial', pos: [-230, 175, -250], at: [10, 0, 30] },
  market: { label: 'Market square', pos: [P.fountain.x - 14, T + 1.75, P.fountain.z - 20], at: [P.fountain.x + 14, T + 7, P.fountain.z + 30] },
  river: { label: 'River and bridges', pos: [80, T + 8, 39], at: [-30, T - 2, 39] },
  cathedral: { label: 'Cathedral', pos: [(cathedral.x0 + cathedral.x1) / 2 - 22, T + 2, 64], at: [(cathedral.x0 + cathedral.x1) / 2, T + 24, (cathedral.z0 + cathedral.z1) / 2] },
  lane: { label: 'Lane at dusk', pos: laneView[0], at: laneView[1] },
  overhead: { label: 'Plan view', pos: [0, 520, 1], at: [0, 0, 0] },
};
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;
function setView(name) {
  const v = VIEWS[name] || VIEWS.aerial;
  camera.position.set(...v.pos);
  controls.target.set(...v.at);
  controls.update();
}
for (const [k, v] of Object.entries(VIEWS)) {
  const b = document.createElement('button');
  b.textContent = v.label;
  b.onclick = () => setView(k);
  $('views').append(b);
}
setView(Q.get('view') || 'aerial');

// ---------- fly keys ----------
const keys = new Set();
addEventListener('keydown', (e) => { if (!e.target.closest('select')) keys.add(e.code); });
addEventListener('keyup', (e) => keys.delete(e.code));
const _f = new THREE.Vector3(), _r = new THREE.Vector3(), _d = new THREE.Vector3();
function fly(dt) {
  if (!keys.size) return;
  const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 60 : 16) * dt;
  camera.getWorldDirection(_f); _f.y = 0; _f.normalize();
  _r.crossVectors(_f, camera.up).normalize();
  _d.set(0, 0, 0);
  if (keys.has('KeyW')) _d.add(_f); if (keys.has('KeyS')) _d.sub(_f);
  if (keys.has('KeyD')) _d.add(_r); if (keys.has('KeyA')) _d.sub(_r);
  if (keys.has('KeyE')) _d.y += 1; if (keys.has('KeyQ')) _d.y -= 1;
  _d.multiplyScalar(speed);
  camera.position.add(_d); controls.target.add(_d);
}

// ---------- UI ----------
$('time').onchange = (e) => { map.setTime(e.target.value); scene.traverse((o) => { if (o.material) o.material.needsUpdate = true; }); };
if (Q.get('time')) $('time').value = Q.get('time');
$('quality').onchange = (e) => post.setQuality(e.target.value);
$('toggle').onclick = () => { $('ui').classList.toggle('min'); $('toggle').textContent = $('ui').classList.contains('min') ? '+' : '-'; };
const save = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
$('json').onclick = () => save(new Blob([JSON.stringify(planToJSON(map))], { type: 'application/json' }), `oldtown-plan-${seed}.json`);
async function exportGlb(detail = $('glbDetail').value) {
  $('status').textContent = 'Baking for export...';
  await new Promise((r) => setTimeout(r, 30));
  const baked = bakeForExport(map, { detail });
  const buf = await new GLTFExporter().parseAsync(baked, { binary: true });
  return { buf, meshes: baked.children.length };
}
$('glb').onclick = async () => {
  const { buf, meshes } = await exportGlb();
  save(new Blob([buf], { type: 'model/gltf-binary' }), `oldtown-${seed}-${$('glbDetail').value}.glb`);
  $('status').textContent = `Exported ${(buf.byteLength / 1048576).toFixed(1)} MB, ${meshes} meshes.`;
};

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight, false);
  post.setSize();
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

// ---------- loop ----------
const clock = new THREE.Clock();
let frames = 0;
function frame() {
  const dt = Math.min(0.1, clock.getDelta());
  fly(dt);
  controls.update();
  map.update(dt, camera, controls.target);
  post.render(camera);
  if (++frames % 30 === 0) {
    const i = renderer.info.render;
    if (!$('status').textContent.startsWith('Export')) $('status').textContent = `${P.lots.length} houses, ${i.calls} draw calls, ${(i.triangles / 1e6).toFixed(2)} M triangles${surfacesPending() ? ', painting textures...' : ''}`;
  }
  requestAnimationFrame(frame);
}
renderer.info.autoReset = true;
frame();
$('loading').classList.add('gone');
console.log(`[viewer] ready in ${Math.round(performance.now() - t0)} ms`);

// for scripted use (headless screenshots, exports)
window.viewer = { THREE, map, scene, camera, controls, renderer, post, setView, VIEWS, exportGlb, planToJSON, surfacesPending, built: true };
</script>
</body>
</html>
